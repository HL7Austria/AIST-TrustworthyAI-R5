# Workflow to deploy with IG Publisher and Shorthand to the hl7austria.github.io repository

name: PublishIG

# Run on updates to the master
on:
  push:
    branches: [ main, 'ballot*' ]
  pull_request:
    branches: [ main ]

# one deploy at a time: all branch builds push to the same Pages branch
concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout the implementation guide
      uses: actions/checkout@v2
      with:
        repository: HL7Austria/AIST-TrustworthyAI-R5
        path: .

    - name: Extract branch name
      run: |
        if ["${{ github.event.pull_request.head.ref }}" == ""]; then
          echo "##[set-output name=branch;]$(echo ${GITHUB_REF#refs/heads/})"
        else
          echo "##[set-output name=branch;]$(echo ${{ github.event.pull_request.head.ref }})"
        fi
      id: extract_branch

    - name: Extract last commit date
      shell: bash
      run: echo "##[set-output name=date;]$(git log -1 --format="%at" | xargs -I{} date -d @{} +%d.%m.%Y)"
      id: extract_date

    - uses: bluwy/substitute-string-action@v1
      id: substitute_index
      with:
        _input-file: input/landing_page/_index.yml
        _format-key: '%%key%%'
        branch: ${{ steps.extract_branch.outputs.branch }}
        date: ${{ steps.extract_date.outputs.date }}
        _output-file: input/landing_page/_index.yml

    - name: Install NPM
      uses: actions/setup-node@v2.1.2
      with:
        check-lastest: true

    - name: Install Sushi
      run: sudo npm install -g fsh-sushi

    - name: Install Jekyll
      run: |
        sudo apt-get install jekyll

    - name: Download IG Publisher
      uses: Legion2/download-release-action@v2.1.0
      with:
        repository: HL7/fhir-ig-publisher
        tag: 'latest'
        path: .
        file: publisher.jar

    - name: Run IG Publisher
      run: |
        mkdir input-cache
        mv publisher.jar ./input-cache/publisher.jar
        unset DISPLAY
        java -Djava.awt.headless=true -jar ./input-cache/publisher.jar -ig ig.ini
    - name: Move index file
      run: |
        mv ./input/landing_page/_index.yml ./output/

    # HL7 Austria IG review: lets readers mark text on the published pages and comment via GitHub issues
    # (https://github.com/HL7Austria/ig-review). Never blocks the IG build.
    - name: Checkout review tool
      continue-on-error: true
      uses: actions/checkout@v4
      with:
        repository: HL7Austria/ig-review
        path: ig-review-tool

    - name: Add review tool
      continue-on-error: true
      run: python3 ig-review-tool/tools/inject.py output --repo "${{ github.repository }}" --branch "${{ steps.extract_branch.outputs.branch }}" --commit "${{ github.sha }}"

    - name: Deploy Implementation Guide
      if: success()
      uses: peaceiris/actions-gh-pages@v3
      with:
        personal_token: ${{ secrets.ROBO_OLIVER }}
        external_repository: HL7Austria/hl7austria.github.io
        publish_branch: pages
        publish_dir: ./output
        destination_dir: ./r5-aist-trustworthyai-${{ steps.extract_branch.outputs.branch }}
